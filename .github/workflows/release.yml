name: release

on:
  push:
    tags: ['v*']

jobs:
  crates:
    # Trusted publishing: crates.io checks this workflow's OIDC identity against the publisher
    # configured on the crate (doctor-labs/doctor-core, release.yml, no environment) and hands
    # back a short-lived token. CARGO_REGISTRY_TOKEN stays only as a fallback until an OIDC
    # release has succeeded; delete the secret and the fallback after that.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag and Cargo.toml name the same version
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "v$cargo_version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME and Cargo.toml $cargo_version must agree"
            exit 1
          fi
      - name: Exchange the OIDC identity for a short-lived crates.io token
        id: auth
        continue-on-error: true # not configured yet: fall back to the secret below
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::no crates.io token (OIDC not configured, CARGO_REGISTRY_TOKEN not set)"
            exit 1
          fi
          cargo publish --locked
